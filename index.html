<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Engineer Portfolio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      background: #020617;
      padding: 18px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      border-bottom: 1px solid #1e293b;
    }

    .logo {
      color: #38bdf8;
      font-size: 24px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 25px;
    }

    nav a:hover {
      color: #38bdf8;
    }

    section {
      min-height: 100vh;
      padding: 120px 8% 60px;
    }

    .hero {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hero h1 {
      font-size: 60px;
      color: white;
    }

    .hero h1 span {
      color: #38bdf8;
    }

    .hero h2 {
      margin-top: 10px;
      color: #94a3b8;
    }

    .hero p {
      max-width: 650px;
      margin: 20px 0;
      color: #cbd5e1;
      font-size: 18px;
    }

    .btn {
      display: inline-block;
      padding: 12px 25px;
      background: #38bdf8;
      color: #020617;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      margin-right: 10px;
    }

    .btn:hover {
      background: #0ea5e9;
    }

    .title {
      color: #38bdf8;
      font-size: 40px;
      margin-bottom: 30px;
    }

    .about {
      max-width: 800px;
      color: #cbd5e1;
      font-size: 18px;
    }

    .skills,
    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: #1e293b;
      padding: 25px;
      border-radius: 10px;
      border: 1px solid #334155;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: #38bdf8;
    }

    .card h3 {
      color: #38bdf8;
      margin-bottom: 10px;
    }

    .card p {
      color: #cbd5e1;
    }

    footer {
      text-align: center;
      padding: 25px;
      background: #020617;
      color: #64748b;
    }

    @media (max-width: 700px) {
      header {
        padding: 15px 5%;
      }

      nav {
        display: none;
      }

      .hero h1 {
        font-size: 40px;
      }
    }
  </style>
</head>

<body>

  <!-- Everything below is created by JavaScript -->

  <script>

    // ==============================
    // PORTFOLIO DATA
    // ==============================

    const portfolio = {

      name: "Your Name",

      role: "DevOps Engineer",

      description:
        "I am a passionate DevOps Engineer specializing in cloud infrastructure, CI/CD automation, containers, monitoring and scalable deployment solutions.",

      about:
        "I enjoy building reliable infrastructure and automating software delivery. My focus areas include AWS, Docker, Kubernetes, Jenkins, Terraform, Linux and CI/CD pipelines.",

      skills: [
        "AWS",
        "Docker",
        "Kubernetes",
        "Jenkins",
        "Terraform",
        "Ansible",
        "Linux",
        "Git & GitHub",
        "Prometheus",
        "Grafana"
      ],

      projects: [
        {
          title: "CI/CD Pipeline",
          description:
            "Created an automated CI/CD pipeline using Jenkins, GitHub, Docker and AWS.",
          technologies:
            "Jenkins • Docker • GitHub • AWS"
        },

        {
          title: "Kubernetes Deployment",
          description:
            "Deployed and managed containerized applications using Kubernetes with automated scaling and rolling updates.",
          technologies:
            "Kubernetes • Docker • Linux"
        },

        {
          title: "Infrastructure as Code",
          description:
            "Automated AWS infrastructure provisioning using Terraform and configuration management using Ansible.",
          technologies:
            "Terraform • Ansible • AWS"
        }
      ],

      email: "your@email.com",

      github: "https://github.com/yourusername"
    };


    // ==============================
    // CREATE HEADER
    // ==============================

    const header = document.createElement("header");

    header.innerHTML = `
      <div class="logo">&lt;DevOps/&gt;</div>

      <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#skills">Skills</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
      </nav>
    `;

    document.body.appendChild(header);


    // ==============================
    // CREATE HOME SECTION
    // ==============================

    const home = document.createElement("section");

    home.id = "home";
    home.className = "hero";

    home.innerHTML = `
      <h1>Hello, I'm <span>${portfolio.name}</span></h1>

      <h2>${portfolio.role}</h2>

      <p>${portfolio.description}</p>

      <div>
        <a class="btn" href="#projects">View Projects</a>
        <a class="btn" href="#contact">Contact Me</a>
      </div>
    `;

    document.body.appendChild(home);


    // ==============================
    // CREATE ABOUT SECTION
    // ==============================

    const about = document.createElement("section");

    about.id = "about";

    about.innerHTML = `
      <h2 class="title">About Me</h2>

      <p class="about">
        ${portfolio.about}
      </p>
    `;

    document.body.appendChild(about);


    // ==============================
    // CREATE SKILLS SECTION
    // ==============================

    const skillsSection = document.createElement("section");

    skillsSection.id = "skills";

    skillsSection.innerHTML = `
      <h2 class="title">My Skills</h2>

      <div class="skills" id="skillsContainer"></div>
    `;

    document.body.appendChild(skillsSection);

    const skillsContainer =
      document.getElementById("skillsContainer");

    portfolio.skills.forEach(skill => {

      const card = document.createElement("div");

      card.className = "card";

      card.innerHTML = `
        <h3>⚙️ ${skill}</h3>
        <p>DevOps technology and tooling</p>
      `;

      skillsContainer.appendChild(card);
    });


    // ==============================
    // CREATE PROJECTS SECTION
    // ==============================

    const projectsSection = document.createElement("section");

    projectsSection.id = "projects";

    projectsSection.innerHTML = `
      <h2 class="title">Projects</h2>

      <div class="projects" id="projectsContainer"></div>
    `;

    document.body.appendChild(projectsSection);

    const projectsContainer =
      document.getElementById("projectsContainer");

    portfolio.projects.forEach(project => {

      const card = document.createElement("div");

      card.className = "card";

      card.innerHTML = `
        <h3>${project.title}</h3>

        <p>${project.description}</p>

        <br>

        <p>
          <strong>Technologies:</strong><br>
          ${project.technologies}
        </p>
      `;

      projectsContainer.appendChild(card);
    });


    // ==============================
    // CREATE CONTACT SECTION
    // ==============================

    const contact = document.createElement("section");

    contact.id = "contact";

    contact.innerHTML = `
      <h2 class="title">Contact Me</h2>

      <p class="about">
        Interested in DevOps, Cloud or Automation?
        Let's connect!
      </p>

      <br>

      <a class="btn"
         href="mailto:${portfolio.email}">
         Email Me
      </a>

      <a class="btn"
         href="${portfolio.github}"
         target="_blank">
         GitHub
      </a>
    `;

    document.body.appendChild(contact);


    // ==============================
    // FOOTER
    // ==============================

    const footer = document.createElement("footer");

    footer.innerHTML = `
      © 2026 ${portfolio.name} | DevOps Engineer
    `;

    document.body.appendChild(footer);


    // ==============================
    // SMOOTH SCROLLING
    // ==============================

    document.querySelectorAll("nav a").forEach(link => {

      link.addEventListener("click", function(event) {

        event.preventDefault();

        const target =
          document.querySelector(this.getAttribute("href"));

        target.scrollIntoView({
          behavior: "smooth"
        });

      });

    });

  </script>

</body>
</html>
